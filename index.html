<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>랜덤 QR</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; }
    body { display: grid; place-items: center; color: #fff; font-family: Arial, Helvetica, sans-serif; }
  </style>
</head>
<body>
  <div>로딩 중...</div>
  <script>
    const storageKey = 'randomQRResult_v4';
    let result = localStorage.getItem(storageKey);
    if (!result) {
      result = String(Math.floor(Math.random() * 3) + 1);
      localStorage.setItem(storageKey, result);
    }
    window.location.replace(result + '.html');
  </script>
</body>
</html>
